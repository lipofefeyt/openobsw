# telecommands.yaml — TC command definitions
#
# Each telecommand has:
#   name        Snake_case identifier — used in code generation
#   description Human-readable description
#   apid        Application Process ID (hex, 11-bit)
#   service     PUS service type
#   subservice  PUS subservice type
#   parameters  User data field parameters (ordered list). The last one may
#               set count_from: <earlier unsigned argument>, making it repeat
#               that many times (exported to XTCE as an ArrayArgumentType)
#   safe_allowed  Optional, default false. true puts (service, subservice)
#                 on the SAFE/STANDBY TC whitelist (SRDB_SAFE_TC_WHITELIST),
#                 used by every target. All other TCs need NOMINAL and are
#                 rejected with TM(1,2) code 0x0007 in SAFE/STANDBY.
#
# Parameter types: uint8, uint16, uint32, int8, int16, int32

telecommands:
  # ---- S17 — Test --------------------------------------------------------

  - name: are_you_alive
    description: "TC(17,1) connection test — expects TM(17,2) response"
    apid: 0x010
    service: 17
    subservice: 1
    safe_allowed: true
    parameters: []

  # ---- S3 — Housekeeping -------------------------------------------------

  - name: enable_hk_report
    description: "TC(3,5) enable periodic HK report generation for a set"
    apid: 0x010
    service: 3
    subservice: 5
    parameters:
      - name: set_id
        type: uint8
        description: "HK structure ID"
      - name: interval_ticks
        type: uint32
        description: "Collection interval in control cycle ticks"

  - name: define_hk_report
    description: "TC(3,1) create an HK set from S20 parameter IDs (created disabled)"
    apid: 0x010
    service: 3
    subservice: 1
    parameters:
      - name: set_id
        type: uint8
        description: "HK structure ID (must be unused)"
      - name: interval_ticks
        type: uint32
        description: "Collection interval in control cycle ticks"
      - name: n
        type: uint8
        description: "Number of parameter IDs that follow"
      - name: param_ids
        type: uint16
        count_from: n
        description: "S20 parameter IDs, in report order"

  - name: delete_hk_report
    description: "TC(3,3) delete HK sets created by TC(3,1); all or nothing"
    apid: 0x010
    service: 3
    subservice: 3
    parameters:
      - name: n
        type: uint8
        description: "Number of set IDs that follow"
      - name: set_ids
        type: uint8
        count_from: n
        description: "HK structure IDs to delete"

  - name: disable_hk_report
    description: "TC(3,6) disable periodic HK report generation for a set"
    apid: 0x010
    service: 3
    subservice: 6
    parameters:
      - name: set_id
        type: uint8
        description: "HK structure ID"

  # ---- S8 - Function Management -----------------------------------------

  - name: s8_perform_function
    description: "TC(8,1) perform an on-board function"
    apid: 0x010
    service: 8
    subservice: 1
    safe_allowed: true
    parameters:
      - name: function_id
        type: uint16
        description: "Function ID (1=recover_nominal)"
      - name: args_len
        type: uint8
        description: "Length of arguments in bytes"

  # ---- S9 - Time Management ---------------------------------------------

  - name: set_obt
    description: "TC(9,128) set on-board time (mission-specific subservice), CUC-4,2"
    apid: 0x010
    service: 9
    subservice: 128
    safe_allowed: true
    parameters:
      - name: coarse
        type: uint32
        description: "Whole seconds"
      - name: fine
        type: uint16
        description: "Fractional seconds, 1/65536 s units"

  # ---- S20 - Parameter Management ---------------------------------------

  - name: set_parameter
    description: "TC(20,1) set an on-board parameter value"
    apid: 0x010
    service: 20
    subservice: 1
    parameters:
      - name: param_id
        type: uint16
        description: "SRDB parameter ID"
      - name: raw_value
        type: uint32
        description: "Raw 32-bit value (float32 parameters as IEEE 754 bits)"

  - name: get_parameter
    description: "TC(20,3) get an on-board parameter value, reported in TM(20,2)"
    apid: 0x010
    service: 20
    subservice: 3
    safe_allowed: true
    parameters:
      - name: param_id
        type: uint16
        description: "SRDB parameter ID"
