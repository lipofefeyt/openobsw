# hk_sets.yaml — S3 housekeeping set definitions
#
# Each HK set has:
#   id                    Unique set ID (uint8, matches obsw_s3_set_t.set_id)
#   name                  Snake_case identifier
#   description           Human-readable description
#   parameters            Ordered list of parameter names (must exist in parameters.yaml)
#   default_interval_ticks  Default collection interval (0 = disabled at boot)
#   spid                  Spacecraft Packet ID — unique identifier for XTCE/SCOS-2K tools

hk_sets:
  - id: 1
    name: nominal_hk
    spid: 1001
    description: "Nominal housekeeping — thermal, power, uptime"
    parameters:
      - obc_temperature
      - obc_voltage_3v3
      - obc_voltage_5v
      - obc_uptime
    default_interval_ticks: 10

  - id: 2
    name: fdir_hk
    spid: 1002
    description: "FDIR housekeeping — safe mode and watchdog statistics"
    parameters:
      - safe_mode_entry_count
      - watchdog_kick_count
      - watchdog_ticks_remaining
    default_interval_ticks: 60

  - id: 4
    name: aocs_hk
    spid: 1004
    description: "AOCS housekeeping — control gains (S20-tunable)"
    parameters:
      - bdot_gain
      - adcs_kp
      - adcs_kd
    default_interval_ticks: 5

  - id: 3
    name: dhs_obc_hk
    spid: 1003
    description: "DHS OBC housekeeping — mode, OBT, watchdog, health, resources"
    parameters:
      - obc_mode
      - obc_obt
      - obc_watchdog_status
      - obc_memory_used_pct
      - obc_health
      - obc_reset_count
      - obc_cpu_load
    default_interval_ticks: 10

  - id: 5
    name: aocs_orbit_hk
    spid: 1005
    description: "AOCS orbit and dynamics configuration — altitude, inclination, inertia tensor, MTQ limits"
    parameters:
      - orbit_altitude_km
      - orbit_inclination_deg
      - sc_inertia_xx
      - sc_inertia_yy
      - sc_inertia_zz
      - mtq_max_dipole
    default_interval_ticks: 0

  - id: 6
    name: aocs_state_hk
    spid: 1006
    description: "AOCS live state — attitude error from nadir, angular rate magnitude, active controller"
    parameters:
      - aocs_angle_err_rad
      - aocs_omega_mag
      - aocs_controller
    default_interval_ticks: 5
