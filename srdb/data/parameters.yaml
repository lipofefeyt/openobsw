# parameters.yaml — telemetry parameter definitions
#
# Each parameter has:
#   id          Unique 16-bit parameter ID (hex)
#   name        Snake_case identifier — used in HK sets and code generation
#   description Human-readable description
#   type        C-compatible type: uint8, uint16, uint32, int8, int16, int32, float32
#   ptc         ECSS PUS parameter type code (1=uint, 2=int, 5=float)
#   pfc         ECSS PUS parameter format code (bit-width for ptc 1/2; 1=32b for ptc 5)
#   subsystem   Logical subsystem path for XTCE SpaceSystem hierarchy
#   unit        Engineering unit string (optional)
#   enumeration Discrete state table (optional, ptc 1/2 only)
#   conversion  Raw → engineering conversion (optional)
#   limits      Soft and hard limits in engineering units (optional)

parameters:
  # ---- OBC thermal -------------------------------------------------------

  - id: 0x0001
    name: obc_temperature
    description: "OBC board temperature (internal sensor)"
    type: int16
    ptc: 2
    pfc: 16
    subsystem: DHS/OBC
    unit: degC
    conversion:
      type: linear
      slope: 0.1
      offset: -40.0
    limits:
      soft_low: -10.0
      soft_high: 60.0
      hard_low: -20.0
      hard_high: 85.0

  # ---- OBC power ---------------------------------------------------------

  - id: 0x0002
    name: obc_voltage_3v3
    description: "OBC 3.3V rail voltage"
    type: uint16
    ptc: 1
    pfc: 16
    subsystem: DHS/OBC
    unit: mV
    limits:
      soft_low: 3100.0
      soft_high: 3500.0
      hard_low: 2800.0
      hard_high: 3800.0

  - id: 0x0003
    name: obc_voltage_5v
    description: "OBC 5V rail voltage"
    type: uint16
    ptc: 1
    pfc: 16
    subsystem: DHS/OBC
    unit: mV
    limits:
      soft_low: 4750.0
      soft_high: 5250.0
      hard_low: 4500.0
      hard_high: 5800.0

  # ---- OBC uptime --------------------------------------------------------

  - id: 0x0004
    name: obc_uptime
    description: "OBC uptime since last boot"
    type: uint32
    ptc: 1
    pfc: 32
    subsystem: DHS/OBC
    unit: s

  # ---- FDIR / safe mode --------------------------------------------------

  - id: 0x0005
    name: safe_mode_entry_count
    description: "Number of safe mode transitions since boot"
    type: uint16
    ptc: 1
    pfc: 16
    subsystem: DHS/FDIR
    unit: count

  - id: 0x0006
    name: watchdog_kick_count
    description: "Total watchdog kick count since boot"
    type: uint32
    ptc: 1
    pfc: 32
    subsystem: DHS/FDIR
    unit: count

  - id: 0x0007
    name: watchdog_ticks_remaining
    description: "Ticks remaining before watchdog expiry"
    type: uint32
    ptc: 1
    pfc: 32
    subsystem: DHS/FDIR
    unit: ticks

  # ---- DHS OBC housekeeping (consumed by opensvf OBCEmulatorAdapter) ----
  #
  # These seven parameters form the canonical DHS OBC telemetry set.
  # opensvf parses them from TM(3,25) set_id=3 (SPID 1003) and maps
  # them to its internal port variables for simulation step.

  - id: 0x4001
    name: obc_mode
    description: "OBC operational mode"
    type: uint8
    ptc: 1
    pfc: 8
    subsystem: DHS/OBC
    enumeration:
      - {value: 0, label: STANDBY}
      - {value: 1, label: SAFE}
      - {value: 2, label: NOMINAL}

  - id: 0x4003
    name: obc_obt
    description: "On-board time"
    type: uint32
    ptc: 1
    pfc: 32
    subsystem: DHS/OBC
    unit: s

  - id: 0x4004
    name: obc_watchdog_status
    description: "Software watchdog status"
    type: uint8
    ptc: 1
    pfc: 8
    subsystem: DHS/OBC
    enumeration:
      - {value: 0, label: NOMINAL}
      - {value: 1, label: EXPIRED}

  - id: 0x4006
    name: obc_memory_used_pct
    description: "Mass memory fill percentage"
    type: uint8
    ptc: 1
    pfc: 8
    subsystem: DHS/OBC
    unit: '%'

  - id: 0x4008
    name: obc_health
    description: "OBC health status"
    type: uint8
    ptc: 1
    pfc: 8
    subsystem: DHS/OBC
    enumeration:
      - {value: 0, label: NOMINAL}
      - {value: 1, label: DEGRADED}
      - {value: 2, label: FAILED}

  - id: 0x4009
    name: obc_reset_count
    description: "OBC reset counter since first boot"
    type: uint16
    ptc: 1
    pfc: 16
    subsystem: DHS/OBC
    unit: count

  - id: 0x400A
    name: obc_cpu_load
    description: "OBC CPU utilisation"
    type: uint8
    ptc: 1
    pfc: 8
    subsystem: DHS/OBC
    unit: '%'

  # ---- AOCS control gains (S20 tunable) ----------------------------------

  - id: 0x20A0
    name: bdot_gain
    description: "B-dot controller gain k_bdot (m_cmd = -k * B_dot)"
    type: float32
    ptc: 5
    pfc: 1
    subsystem: AOCS/Control
    unit: 'Am2.s/T'

  - id: 0x20A3
    name: bdot_hpf_tau
    description: "B-dot HPF time constant τ [s] — first-order high-pass filter that rejects orbital-rate dB/dt while passing attitude-rate dB/dt. Set to 0 to disable. Typical: 15 s (bench-validated for 550 km SSO, issue #70)."
    type: float32
    ptc: 5
    pfc: 1
    subsystem: AOCS/Control
    unit: s
    limits:
      soft_low: 0.0

  - id: 0x20A1
    name: adcs_kp
    description: "ADCS PD proportional gain Kp (τ = -Kp*q_err_vec - Kd*ω)"
    type: float32
    ptc: 5
    pfc: 1
    subsystem: AOCS/Control
    unit: 'N.m/rad'

  - id: 0x20A2
    name: adcs_kd
    description: "ADCS PD derivative gain Kd (τ = -Kp*q_err_vec - Kd*ω)"
    type: float32
    ptc: 5
    pfc: 1
    subsystem: AOCS/Control
    unit: 'N.m.s/rad'

  # ---- Orbit and spacecraft physical parameters (#68) ---------------------
  #
  # S20-accessible configuration readable by the opensvf-kde harness via
  # TC(20,3). Ground can override via TC(20,1) before launching a simulation.
  # IDs 0x3001-0x3032.

  - id: 0x3001
    name: orbit_altitude_km
    description: "Orbital altitude above Earth's surface"
    type: float32
    ptc: 5
    pfc: 1
    subsystem: AOCS/Orbit
    unit: km
    limits:
      soft_low: 400.0
      soft_high: 1000.0

  - id: 0x3002
    name: orbit_inclination_deg
    description: "Orbital inclination"
    type: float32
    ptc: 5
    pfc: 1
    subsystem: AOCS/Orbit
    unit: deg

  - id: 0x3010
    name: sc_inertia_xx
    description: "Spacecraft principal moment of inertia Ixx"
    type: float32
    ptc: 5
    pfc: 1
    subsystem: AOCS/Dynamics
    unit: 'kg.m2'

  - id: 0x3011
    name: sc_inertia_yy
    description: "Spacecraft principal moment of inertia Iyy"
    type: float32
    ptc: 5
    pfc: 1
    subsystem: AOCS/Dynamics
    unit: 'kg.m2'

  - id: 0x3012
    name: sc_inertia_zz
    description: "Spacecraft principal moment of inertia Izz"
    type: float32
    ptc: 5
    pfc: 1
    subsystem: AOCS/Dynamics
    unit: 'kg.m2'

  - id: 0x3020
    name: mtq_max_dipole
    description: "Magnetorquer maximum dipole moment per axis"
    type: float32
    ptc: 5
    pfc: 1
    subsystem: AOCS/Actuators
    unit: 'Am2'

  - id: 0x3030
    name: sc_omega_x0
    description: "Initial spacecraft angular velocity x (body frame)"
    type: float32
    ptc: 5
    pfc: 1
    subsystem: AOCS/Dynamics
    unit: 'rad/s'

  - id: 0x3031
    name: sc_omega_y0
    description: "Initial spacecraft angular velocity y (body frame)"
    type: float32
    ptc: 5
    pfc: 1
    subsystem: AOCS/Dynamics
    unit: 'rad/s'

  - id: 0x3032
    name: sc_omega_z0
    description: "Initial spacecraft angular velocity z (body frame)"
    type: float32
    ptc: 5
    pfc: 1
    subsystem: AOCS/Dynamics
    unit: 'rad/s'

  # ---- AOCS live state (S3 HK set_id=6) ----------------------------------

  - id: 0x20B0
    name: aocs_angle_err_rad
    description: "Attitude error angle from nadir target (valid in NOMINAL mode)"
    type: float32
    ptc: 5
    pfc: 1
    subsystem: AOCS/Control
    unit: rad
    limits:
      soft_high: 0.0349   # 2 deg

  - id: 0x20B1
    name: aocs_omega_mag
    description: "Angular velocity magnitude |ω| in body frame"
    type: float32
    ptc: 5
    pfc: 1
    subsystem: AOCS/Control
    unit: 'rad/s'

  - id: 0x20B2
    name: aocs_controller
    description: "Active AOCS controller"
    type: uint8
    ptc: 1
    pfc: 8
    subsystem: AOCS/Control
    enumeration:
      - {value: 0, label: 'OFF'}
      - {value: 1, label: BDOT}
      - {value: 2, label: PD}
