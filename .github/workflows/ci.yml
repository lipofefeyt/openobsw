name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Monthly rebuild keeps the target binary artifacts (90-day retention)
  # alive for opensvf's cross-repo Renode test even when main is quiet.
  schedule:
    - cron: '0 6 1 * *'
  workflow_dispatch:

jobs:
  build-and-test:
    name: ${{ matrix.compiler }} / ${{ matrix.build_type }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        build_type: [Debug, Release]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build gcc clang python3-pip
          pip install pydantic pyyaml pytest --break-system-packages
          pip install -e srdb/ --break-system-packages

      - name: Configure
        run: |
          cmake -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DCMAKE_C_COMPILER=${{ matrix.compiler }} \
            -DOBSW_WERROR=ON

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: System tests (obsw_sim over wire protocol)
        run: OBSW_SIM=build/sim/obsw_sim pytest test/system -v

      # Requirements traceability: every IMPLEMENTED test-method requirement in
      # docs/SRS.md has a verifying test, plus symbol checks on libobsw.a.
      - name: Traceability
        if: matrix.compiler == 'gcc' && matrix.build_type == 'Debug'
        run: python3 tools/trace.py --lib build/src/libobsw.a --out build/traceability.md

      - name: Upload traceability matrix
        if: matrix.compiler == 'gcc' && matrix.build_type == 'Debug'
        uses: actions/upload-artifact@v4
        with:
          name: traceability-matrix
          path: build/traceability.md
          retention-days: 90

  srdb:
    name: SRDB Python tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: pip install -e "srdb/[dev]" --break-system-packages

      - name: Test
        run: pytest srdb/tests/ -v

  asan:
    name: ASAN / UBSAN (gcc)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build gcc clang python3-pip
          pip install pydantic pyyaml --break-system-packages
          pip install -e srdb/ --break-system-packages

      - name: Configure with sanitizers
        run: |
          cmake -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DOBSW_ENABLE_ASAN=ON

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

  # ------------------------------------------------------------------ #
  # Core coverage gate (OBSW-SRS-262): unit, integration and system    #
  # tests together must cover >= 90% of core library lines             #
  # ------------------------------------------------------------------ #
  coverage:
    name: Coverage (core >= 90% lines)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build gcc python3-pip
          pip install pydantic pyyaml pytest gcovr --break-system-packages
          pip install -e srdb/ --break-system-packages

      - name: Configure with coverage
        run: |
          cmake -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DOBSW_ENABLE_COVERAGE=ON

      - name: Build
        run: cmake --build build

      - name: Unit and integration tests
        run: ctest --test-dir build --output-on-failure

      - name: System tests
        run: OBSW_SIM=build/sim/obsw_sim pytest test/system -q

      - name: Coverage report and gate
        run: |
          mkdir -p build/coverage
          gcovr -r . --object-directory build \
            --filter 'src/(ccsds|tc|tm|pus|fdir|aocs|time)/' \
            --print-summary --txt build/coverage.txt \
            --html-details build/coverage/index.html \
            --fail-under-line 90
          cat build/coverage.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            build/coverage.txt
            build/coverage/
          retention-days: 90

  # ------------------------------------------------------------------ #
  # Static analysis (OBSW-SRS-263): cppcheck + MISRA C:2012 addon on   #
  # the core library. Required rules at zero; Advisory suppressions    #
  # are justified in docs/misra-deviations.md                          #
  # ------------------------------------------------------------------ #
  static-analysis:
    name: cppcheck + MISRA (core)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build gcc cppcheck python3-pip
          pip install pydantic pyyaml --break-system-packages
          pip install -e srdb/ --break-system-packages
          cppcheck --version

      - name: Generate SRDB header
        run: |
          cmake -B build -G Ninja -DOBSW_BUILD_TESTS=OFF -DOBSW_BUILD_SIM=OFF
          cmake --build build --target srdb_codegen

      # Guards against a run that reports nothing because the addon did not
      # load or style-severity findings were filtered out
      - name: MISRA canary (addon must report)
        run: |
          out=$(cppcheck --std=c11 --enable=style \
            --addon=misra --addon-python=/usr/bin/python3 \
            tools/misra-canary.c 2>&1)
          echo "$out"
          echo "$out" | grep -q 'misra-c2012-15.6' \
            || { echo "::error::MISRA addon produced no findings on the canary"; exit 1; }

      - name: cppcheck + MISRA
        run: |
          cppcheck --std=c11 \
            --enable=warning,style,performance,portability \
            --addon=misra --addon-python=/usr/bin/python3 \
            --inline-suppr --suppressions-list=tools/cppcheck-suppressions.txt \
            --error-exitcode=1 --quiet \
            -I include -I build/include \
            src/ccsds src/tc src/tm src/pus src/fdir src/aocs src/time

  # ------------------------------------------------------------------ #
  # ZynqMP bare-metal binary — build and publish as workflow artifact  #
  # Runs on main pushes + monthly schedule (not PRs)                   #
  # ------------------------------------------------------------------ #
  build-zynqmp:
    name: ZynqMP bare-metal binary
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build python3-pip wget
          pip install pydantic pyyaml --break-system-packages
          pip install -e srdb/ --break-system-packages

      - name: Install aarch64-none-elf toolchain
        run: |
          wget -q https://developer.arm.com/-/media/Files/downloads/gnu/12.3.rel1/binrel/arm-gnu-toolchain-12.3.rel1-x86_64-aarch64-none-elf.tar.xz
          tar -xf arm-gnu-toolchain-12.3.rel1-x86_64-aarch64-none-elf.tar.xz -C /tmp
          echo "/tmp/arm-gnu-toolchain-12.3.rel1-x86_64-aarch64-none-elf/bin" >> $GITHUB_PATH

      - name: Verify toolchain
        run: aarch64-none-elf-gcc --version

      - name: Configure ZynqMP bare-metal build
        run: |
          cmake -B build_zynqmp \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE=cmake/aarch64-none-elf.cmake \
            -DOBSW_BUILD_TESTS=OFF \
            -DOBSW_BUILD_SIM=OFF \
            -DOBSW_BUILD_ZYNQMP=ON \
            -G Ninja \
            -DPython3_EXECUTABLE=$(which python3)

      - name: Build ZynqMP binary
        run: |
          cmake --build build_zynqmp
          aarch64-none-elf-objcopy -O binary \
            build_zynqmp/obsw_zynqmp \
            build_zynqmp/obsw_zynqmp.bin
          ls -lh build_zynqmp/obsw_zynqmp.bin

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: obsw_zynqmp_bin
          path: build_zynqmp/obsw_zynqmp.bin
          retention-days: 90

  # ------------------------------------------------------------------ #
  # STM32H750 bare-metal binary — build and publish as artifact        #
  # ------------------------------------------------------------------ #
  build-stm32h7:
    name: STM32H750 bare-metal binary
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build python3-pip gcc-arm-none-eabi
          pip install pydantic pyyaml --break-system-packages
          pip install -e srdb/ --break-system-packages

      - name: Verify toolchain
        run: arm-none-eabi-gcc --version

      - name: Configure STM32H7 build
        run: |
          cmake -S targets/stm32h7 -B build_stm32h7 \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE=$(pwd)/cmake/stm32h7-toolchain.cmake \
            -DPython3_EXECUTABLE=$(which python3) \
            -DOBSW_ROOT=$(pwd)

      - name: Build STM32H7 binary
        run: |
          cmake --build build_stm32h7 -j$(nproc)
          ls -lh build_stm32h7/obsw_stm32h7.bin

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: obsw_stm32h7_bin
          path: build_stm32h7/obsw_stm32h7.bin
          retention-days: 90